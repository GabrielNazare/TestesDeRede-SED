name: CI - Handover Simulator

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  cpp-tests:
    name: "C++ [${{ matrix.compiler }}] Build & Tests"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang

      - name: Cache de dependências (FetchContent)
        uses: actions/cache@v4
        with:
          path: simulator/build/_deps
          key: deps-${{ matrix.compiler }}-${{ hashFiles('simulator/CMakeLists.txt') }}

      - name: Compilar o projeto
        working-directory: simulator
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug .
          cmake --build build --parallel

      - name: Executar testes unitários (Google Test)
        working-directory: simulator/build
        run: ctest --output-on-failure --verbose

      - name: Executar modo sintético (smoke test)
        working-directory: simulator/build
        run: ./handover_sim synthetic

  sanitizers:
    name: "C++ Sanitizers (ASan + UBSan)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Cache de dependências
        uses: actions/cache@v4
        with:
          path: simulator/build/_deps
          key: deps-sanitizer-${{ hashFiles('simulator/CMakeLists.txt') }}

      - name: Build com ASan + UBSan
        working-directory: simulator
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            .
          cmake --build build --parallel

      - name: Rodar testes com Sanitizers
        working-directory: simulator/build
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --output-on-failure

      - name: Smoke test com Sanitizers
        working-directory: simulator/build
        run: ./handover_sim synthetic

  coverage:
    name: "Code Coverage Report"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake lcov

      - name: Build com coverage
        working-directory: simulator
        run: |
          cmake -B build -DENABLE_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug .
          cmake --build build --parallel

      - name: Executar testes
        working-directory: simulator/build
        run: ctest --output-on-failure

      - name: Gerar relatório de cobertura
        working-directory: simulator
        run: |
          lcov --capture --directory build --output-file build/coverage.info --ignore-errors mismatch
          lcov --remove build/coverage.info '*/build/_deps/*' '/usr/*' --output-file build/coverage_filtered.info
          genhtml build/coverage_filtered.info --output-directory build/coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: simulator/build/coverage-report/

  python-tests:
    name: "Python Lint & Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: scanner
        run: pip install -r requirements.txt

      - name: Verificar sintaxe (lint)
        run: python -m py_compile scanner/main.py scanner/data_logger.py

  docker-build:
    name: "Docker Build Validation"
    runs-on: ubuntu-latest
    needs: [cpp-tests, python-tests]

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Criar diretório de dados
        run: mkdir -p data

      - name: Build da imagem Docker
        run: docker build -t handover-sim:ci .

      - name: Smoke test no container
        run: docker run --rm handover-sim:ci synthetic
